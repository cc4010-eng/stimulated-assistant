services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stimulated
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stimulated"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/stimulated
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage-data:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
